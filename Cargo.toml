[package]
name = "npm-audit"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/MatthieuELIE/npm-audit"
description = "A better npm audit: colored, severity-sorted, with dependency chains and fix commands"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
